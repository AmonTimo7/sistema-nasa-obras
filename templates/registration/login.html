{% extends "base.html" %}
{% load icones %}
{% block titulo %}Entrar{% endblock %}
{% block publico %}
<div class="login">
  <div class="cartao">
    <div class="logo">{% icone "capacete" %}</div>
    <h1 style="font-size:24px">Nasa Obras</h1>
    <p class="mudo" style="margin:6px 0 0">Entre com seu usuário</p>
    {% if form.errors %}<p class="negativo rotulo" style="margin:14px 0 0">Usuário ou senha não conferem.</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      <input type="text" name="username" aria-label="Usuário" placeholder="Usuário" autocomplete="username" autofocus required>
      <input type="password" name="password" aria-label="Senha" placeholder="Senha" autocomplete="current-password" required>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="botao primario" type="submit">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
